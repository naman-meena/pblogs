<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PBlogs — Naman's Projects</title>
<meta name="description" content="A running log of ongoing and completed projects.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📓</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>

<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="./">PBLOGS</a>
    <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle color theme"></button>
  </div>
</header>

<main id="main">
  <div class="wrap layout">
    <section class="projects-col" aria-label="Projects">
      <div class="controls" aria-label="Filter projects">
        <div class="filter-chips" role="group" aria-label="Filter by status">
          <button class="chip is-active" data-filter="all" type="button">All ({{COUNT_ALL}})</button>
          <button class="chip" data-filter="ongoing" type="button">Ongoing ({{COUNT_ONGOING}})</button>
          <button class="chip" data-filter="completed" type="button">Completed ({{COUNT_COMPLETED}})</button>
        </div>
        <input id="search" class="search" type="search" placeholder="Search title or tag" aria-label="Search projects">
      </div>

      <div id="project-grid" class="project-grid">
{{PROJECT_CARDS}}
      </div>
      <p id="no-results" class="no-results" hidden>No projects match your search.</p>
    </section>

    <aside class="about-col" aria-label="About me">
      <img class="about-photo" src="images/profile.jpg" alt="Portrait of Naman Meena">
      <h1 class="about-name">Naman Meena</h1>
      <p class="about-bio">Replace this bio in <code>templates/index.template.html</code> — where you're from, your college, and what degree you're working on.</p>
    </aside>
  </div>
</main>

<footer class="site-footer">
  <div class="wrap">
    <p>Last updated {{BUILD_DATE}}.</p>
    <ul class="footer-social">
      <li><a href="https://github.com/naman-meena" target="_blank" rel="noopener noreferrer">GitHub</a></li>
      <li><a href="https://x.com/your-username" target="_blank" rel="noopener noreferrer">X</a></li>
      <li><a href="https://www.linkedin.com/in/namanmeena" target="_blank" rel="noopener noreferrer">LinkedIn</a></li>
    </ul>
  </div>
</footer>

<script src="script.js"></script>
</body>
</html>
